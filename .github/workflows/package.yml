name: Package Malvis Express

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build website
        env:
          VITE_SUPABASE_URL: https://pgkkojkcbjvhbtcqccmu.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_t_NZiJ5RwbAk3d2j7IfD2Q_jcS9l4rt
        run: npm run build
      - name: Create source and deploy packages
        run: |
          mkdir -p package-output
          zip -r package-output/malvis-express-source.zip . \
            -x ".git/*" "node_modules/*" "package-output/*"
          cd dist
          zip -r ../package-output/malvis-express-site.zip .
          cd ..
          cat > package-output/NETLIFY-SETUP.txt <<'EOF'
          MALVIS EXPRESS - NETLIFY SETUP

          MANUAL NETLIFY DEPLOY
          1. Extract malvis-express-site.zip.
          2. In Netlify, open Add new site > Deploy manually.
          3. Drag the extracted folder contents (index.html and assets folder) into the deploy area.
          4. The compiled website already contains the Supabase project URL and
             public publishable key. No secret/service-role key is included.

          GITHUB / SOURCE DEPLOY
          1. Import malvis01/malvis-express from GitHub in Netlify.
          2. Build command: npm run build
          3. Publish directory: dist
          4. The .env.example values are the public project URL and publishable key;
             add them as VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY
             if you prefer setting Netlify environment variables.

          ADMIN ACCESS
          The owner administrator account and admin role already exist in the
          connected Supabase project. Sign in using its password-only admin page.

          IMPORTANT
          The publishable key is designed for browser use. Never expose a
          Supabase service-role or secret key in frontend code or Netlify
          VITE_ variables. Customer accounts, payment processing and live
          carrier integrations remain future launch work.
          EOF
      - name: Upload ZIP packages
        uses: actions/upload-artifact@v4
        with:
          name: malvis-express-netlify-package
          path: package-output/*
          if-no-files-found: error
          retention-days: 30
