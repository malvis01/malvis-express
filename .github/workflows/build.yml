name: Build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build website
        env:
          VITE_SUPABASE_URL: https://pgkkojkcbjvhbtcqccmu.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_t_NZiJ5RwbAk3d2j7IfD2Q_jcS9l4rt
        run: npm run build

      - name: Package source and static site
        run: |
          zip -r malvis-express-source.zip . -x ".git/*" "node_modules/*" "malvis-express-source.zip"
          cd dist
          zip -r ../malvis-express-site.zip .
          cd ..
      - name: Upload Netlify ZIP packages
        uses: actions/upload-artifact@v4
        with:
          name: malvis-express-netlify-package
          path: |
            malvis-express-source.zip
            malvis-express-site.zip
          if-no-files-found: error
          retention-days: 30
